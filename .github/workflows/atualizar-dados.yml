name: Atualizar dados

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      details_limit:
        description: "Quantas partidas da Série A buscar o detalhe"
        default: "80"

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      DETAILS_LIMIT: ${{ inputs.details_limit || '80' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: |
          pip install -r services/api/requirements.txt
          npm ci --prefix services/data-pipeline
      - name: Classificação
        working-directory: services/data-pipeline
        run: |
          rc=0
          for s in a b; do python ingest.py standings "$s" || rc=1; done
          exit $rc
      - name: Jogos e placares
        if: ${{ !cancelled() }}
        working-directory: services/data-pipeline
        run: |
          rc=0
          for s in a b; do python ingest_highlightly.py "$s" || rc=1; done
          exit $rc
      - name: Detalhe da Série A
        if: ${{ !cancelled() }}
        working-directory: services/data-pipeline
        run: python ingest_highlightly_details.py a --limit "$DETAILS_LIMIT"
      - name: Analytics
        if: ${{ !cancelled() }}
        working-directory: services/analytics
        run: |
          rc=0
          for s in a b; do python compute_rolling_stats.py "$s" || rc=1; done
          exit $rc
      - name: Features para o ML
        if: ${{ !cancelled() }}
        working-directory: services/analytics
        run: |
          rc=0
          for s in a b; do python compute_match_features.py "$s" || rc=1; done
          exit $rc
      - name: Previsões
        if: ${{ !cancelled() }}
        working-directory: services/ml
        run: python predict_upcoming.py
